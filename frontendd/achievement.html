<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Achievements - OSwarrior</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar-shared.css">
  <link rel="stylesheet" href="css/navbar-logo.css">
  <link rel="stylesheet" href="css/profile-navbar.css">
  <link rel="stylesheet" href="css/achievement.css">
  <link rel="stylesheet" href="css/profile-dropdown.css" />
  <link rel="stylesheet" href="css/responsive-utilities.css" />
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/modal-shared.css">
</head>
<body class="achievement-user">
  <script type="module" src="js/common-navbar.js"></script>
  <script type="module" src="js/achievement.js"></script>
  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-left">
      <img src="image/os-warrior-logo.png" alt="OS Warrior" class="navbar-logo">
      <h1>Achievements - OSwarrior</h1>
    </div>
    <div class="navbar-right">
      <div class="profile-container" id="profile-toggle">
        <span id="username-navbar">Warrior</span>
        <img id="profile-img-navbar" class="profile-img" src="image/default-profile.png" alt="Profile"/>
        <div id="profile-dropdown" class="profile-dropdown hidden">
          <a id="view-profile" href="profile.html">👤 View Profile</a>
          <a id="view-achievements" href="achievement.html">🏆 Achievements</a>

          <!-- 🧰 Quick Settings Section -->
          <div class="settings-section">
            <p class="settings-title">⚙️ Quick Settings</p>
            <button id="change-avatar">🖼️ Change Avatar</button>
            <button id="edit-name">✏️ Edit Name</button>
          </div>

          <button id="logout-btn">🚪 Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Achievements Section -->
  <div class="achievement-container">
    <h2>Your Achievements</h2>
    <div id="achievement-list" class="achievements-grid">
      <!-- Dynamic achievements will be loaded here -->
      <div class="loading-placeholder" id="loading-placeholder">
        <h3>🔄 Loading Achievements...</h3>
        <p>Please wait while we fetch your progress</p>
      </div>
    </div>
  </div>

  <!-- Modal Edit Name -->
  <div id="modal-edit-name" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>✏️ Edit Warrior Name</h3>
      <input type="text" id="input-new-name" placeholder="Enter your warrior name" maxlength="20">
      <div class="modal-actions">
        <button id="save-name-btn" class="btn-action">💾 Save</button>
        <button id="cancel-name-btn" class="btn-action btn-cancel">❌ Cancel</button>
      </div>
    </div>
  </div>

  <!-- Modal Change Avatar -->
  <div id="modal-change-avatar" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>🖼️ Change Avatar</h3>
      <input type="text" id="input-avatar-url" placeholder="Paste image URL or leave empty for default">
      <div class="upload-divider" style="margin: 25px 0;">
        <span>OR</span>
      </div>
      <div class="upload-section" style="margin: 30px 0 25px 0;">
        <button type="button" class="upload-btn" id="upload-from-device" style="margin-top: 0;">
          📁 Upload from Device
        </button>
        <input type="file" id="input-avatar-file" accept="image/*" style="display:none;">
        <div id="avatar-preview-container" style="display:none; text-align:center; margin-top:20px;">
          <img id="avatar-preview-img" style="max-width:120px; max-height:120px; border-radius:50%; border:3px solid #00FFFF; box-shadow: 0 0 15px rgba(0,255,255,0.3);">
          <p style="color:#00FFFF; font-size:0.8rem; margin-top:8px; font-family:'Orbitron',monospace;">Preview</p>
        </div>
      </div>
      <div class="modal-actions" style="margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(0, 255, 255, 0.2);">
        <button id="save-avatar-btn" class="btn-action">💾 Save</button>
        <button id="cancel-avatar-btn" class="btn-action btn-cancel">❌ Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
