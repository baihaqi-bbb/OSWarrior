<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSWarrior Admin - Quiz Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar-shared.css">
  <link rel="stylesheet" href="css/home-admin.css" />
  <link rel="stylesheet" href="css/admin-quizzes.css" />
  <link rel="stylesheet" href="css/profile-navbar.css">
  <link rel="stylesheet" href="css/profile-dropdown.css" />
  <link rel="stylesheet" href="css/responsive-utilities.css" />
</head>
<body class="home-admin admin-quizzes">
  <!-- Navbar - Same as home admin -->
  <div class="navbar" style="background: rgba(5, 15, 25, 0.95) !important; padding: 15px 30px !important; display: flex !important; justify-content: space-between !important; align-items: center !important; border-bottom: 2px solid rgba(0, 255, 255, 0.6) !important; backdrop-filter: blur(25px) !important; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; z-index: 1000 !important; box-shadow: 0 2px 15px rgba(0, 255, 255, 0.3) !important; height: 70px !important; min-height: 70px !important; max-height: 70px !important;">
    <div class="navbar-left" style="display: flex !important; align-items: center !important; gap: 20px !important;">
      <img src="image/os-warrior-logo.png" alt="OS Warrior" class="navbar-logo" style="height: 55px !important; width: auto !important; filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.7)) !important; transition: all 0.3s ease !important;">
      <h1 style="color: #00FFFF !important; font-size: 1.8rem !important; font-weight: 700 !important; margin: 0 !important; text-shadow: 0 0 15px rgba(0, 255, 255, 0.6) !important; font-family: 'Orbitron', monospace !important; letter-spacing: 1px !important; transition: all 0.3s ease !important;">🧩 Quiz Management</h1>
    </div>
    <div class="navbar-right" style="display: flex !important; align-items: center !important; flex-shrink: 0 !important; overflow: visible !important; position: relative !important;">
      <div class="profile-container" id="profile-toggle">
        <span id="username-navbar">Admin</span>
        <img id="profile-img-navbar" class="profile-img" src="image/default-profile.png" alt="Profile"/>
        
        <!-- Profile Dropdown - Inside profile container for proper positioning -->
        <div id="profile-dropdown" class="profile-dropdown hidden">
          <a id="view-profile" href="profile.html">👤 View Profile</a>
          <a id="view-achievements" href="achievement.html">🏆 Achievements</a>

          <!-- 🧰 Quick Settings Section -->
          <div class="settings-section">
            <p class="settings-title">⚙️ Quick Settings</p>

            <button id="change-avatar">🖼️ Change Avatar</button>
            <button id="edit-name">✏️ Edit Name</button>
          </div>

          <button id="logout-btn">🚪 Logout</button>
        </div>
      </div>
    </div>
  </div>

  <main>
    <!-- 🔍 Enhanced Controls Section -->
    <div class="controls-section">
      <div class="search-wrap">
        <input id="search" placeholder="🔍 Search quizzes by title, ID, or creator..." />
      </div>
      <div class="action-buttons">
        <button id="btn-new" onclick="(window.createNewQuiz || (()=>console.warn('createNewQuiz not ready')))()">
          ✨ Create New Quiz
        </button>
        <button id="btn-refresh" class="action-btn" onclick="(window.loadQuizzes || (()=>{}))()">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- 📊 Enhanced Cyberpunk Table Section -->
    <div class="table-responsive">
      <table id="quizzesTable" class="users-table">
        <thead>
          <tr>
            <th>📋 Quiz ID</th>
            <th>📝 Title</th>
            <th>👤 Created By</th>
            <th>📅 Week</th>
            <th>🌐 Published</th>
            <th>❓ Questions</th>
            <th>⚡ Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 🎪 Enhanced Cyberpunk Modal -->
    <div id="quizModal" style="display:none;">
      <button id="modalClose">✖</button>
      <h2 id="modalTitle">🧩 Quiz Details</h2>
      <div id="modalBody" style="margin-top:12px;max-height:60vh;overflow:auto"></div>
      <div class="modal-actions" style="margin-top:25px;">
        <button id="modalSave">💾 Save</button>
        <button id="modalPublish">🌐 Toggle Publish</button>
        <button id="modalRegenerate">🔄 Regenerate</button>
        <button id="modalDelete">🗑️ Delete</button>
      </div>
    </div>

    <div id="modalBackdrop"></div>
    
    <!-- Modal Tukar Avatar -->
    <div id="modal-change-avatar" class="modal" style="display:none;">
      <div class="modal-content">
        <h3>🖼️ Change Avatar</h3>
        <input type="text" id="input-avatar-url" placeholder="Paste image URL or leave empty for default">
        
        <div class="upload-divider" style="margin: 25px 0;"><span>OR</span></div>
        <div class="upload-section" style="margin: 30px 0 25px 0;">
          <button type="button" class="upload-btn" id="upload-from-device" style="margin-top: 0;">📁 Upload from Device</button>
          <input type="file" id="input-avatar-file" accept="image/*" style="display:none;">
          <div id="avatar-preview-container" style="display:none; text-align:center; margin-top:20px;">
            <img id="avatar-preview-img" style="max-width:120px; max-height:120px; border-radius:50%; border:3px solid #00FFFF; box-shadow: 0 0 15px rgba(0,255,255,0.3);">
            <p style="color:#00FFFF; font-size:0.8rem; margin-top:8px; font-family:'Orbitron',monospace;">Preview</p>
          </div>
        </div>
        
        <div class="modal-actions" style="margin-top: 35px;">
          <button id="save-avatar-btn" class="btn-action">💾 Save</button>
          <button id="cancel-avatar-btn" class="btn-action btn-cancel">❌ Cancel</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/home-admin.js"></script>
  <script type="module" src="js/admin-quizzes.js"></script>
</body>
</html>
